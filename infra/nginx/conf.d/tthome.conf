# TTHome gateway. Mounted as /etc/nginx/conf.d, so this file lives in the http context.
# Add one upstream and one location per service that has an API.

upstream identity_service {
    server identity-service:8081;
    keepalive 16;
}

upstream listing_service {
    server listing-service:8083;
    keepalive 16;
}

upstream media_service {
    server media-service:8085;
    keepalive 16;
}

upstream cms_service {
    server cms-service:8089;
    keepalive 16;
}

# Coarse flood guard per client address; the exact OTP / login limits are enforced by identity-service.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # The client address is whatever connects to this nginx. It is written, never appended to: a client-supplied
    # X-Forwarded-For must not reach identity-service, which uses the address for its per-IP OTP limits.
    # If another proxy or load balancer sits in front of this nginx, enable ngx_http_realip_module here instead
    # (set_real_ip_from <that proxy's address>; real_ip_header X-Forwarded-For;) so $remote_addr is still the user.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        proxy_pass http://identity_service;
    }

    # Longer prefix than /api/v1/admin/, so it wins for the catalog.
    location /api/v1/admin/catalog/ {
        proxy_pass http://listing_service;
    }

    location /api/v1/admin/media/ {
        proxy_pass http://media_service;
    }

    location /api/v1/admin/cms/ {
        proxy_pass http://cms_service;
    }

    location /api/v1/admin/ {
        proxy_pass http://identity_service;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else, including /actuator, is not exposed.
    location / {
        return 404;
    }
}
