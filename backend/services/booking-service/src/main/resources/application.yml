server:
  port: 8087

# Database = Supabase PostgreSQL (không dùng DB local). Chuỗi kết nối lấy ở Dashboard > Connect > JDBC.
# Mỗi service nên dùng role riêng: booking_svc.<PROJECT-REF> (xem db/supabase_roles.sql).
spring:
  config:
    # Loads backend/.env (git-ignored) when the service runs from services/<name>, as IntelliJ and mvnw do; real environment variables still win.
    import: optional:file:../../.env[.properties]
  application:
    name: booking-service
  profiles:
    default: dev                              # chạy local không cần đặt gì; production đặt SPRING_PROFILES_ACTIVE=prod
  datasource:
    # Session pooler (cổng 5432, hỗ trợ IPv4 + prepared statement). Không dùng transaction pooler 6543 cho JPA.
    url: ${SUPABASE_DB_URL}              # jdbc:postgresql://<POOLER-HOST>:5432/postgres?sslmode=require
    username: ${DB_USER:booking_svc.${SUPABASE_PROJECT_REF}}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}   # 11 service x pool: giữ tổng dưới giới hạn kết nối của gói Supabase
      minimum-idle: 1
      # KHÔNG đặt hikari.schema: Hikari chạy SET search_path theo phiên, không an toàn qua pooler
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: booking              # Hibernate tự ghi tên schema vào SQL nên không cần search_path
  flyway:
    schemas: booking
    default-schema: booking
    # Schema nền (db/tthome_schema.sql) đã chạy tay trên Supabase = V1. Migration của service bắt đầu từ V2.
    baseline-on-migrate: true
    baseline-version: 1
    # Migrate nên chạy bằng kết nối direct/session: đặt FLYWAY_URL riêng nếu cần
    url: ${FLYWAY_URL:${SUPABASE_DB_URL}}
    # Spring Boot does not reuse the datasource credentials once flyway.url is set, so repeat them here.
    user: ${DB_USER:booking_svc.${SUPABASE_PROJECT_REF}}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

tthome:
  security:
    jwt-secret: ${JWT_SECRET}      # the secret identity-service signs access tokens with

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger UI and /v3/api-docs are only exposed by the dev profile (application-dev.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
