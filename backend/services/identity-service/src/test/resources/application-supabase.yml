# Profile for *SupabaseIT: connection details come from the real environment variables
# (SUPABASE_DB_URL, SUPABASE_PROJECT_REF, DB_PASSWORD, JWT_SECRET, OTP_PEPPER), never from this file.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

tthome:
  mail:
    enabled: false   # tests use the in-memory sender; never send real email from a developer's MAIL_ENABLED
